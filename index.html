/* =========================================

   設定

========================================= */

const STAMP_DISTANCE = 20;

let currentPosition = null;

let stamps = JSON.parse(

  localStorage.getItem("pokemonStamps") || "{}"

);

/* =========================================

   一覧表示

========================================= */

function renderSpots() {

  const container = document.getElementById("spots");

  container.innerHTML = "";

  spots.forEach((spot, index) => {

    const completed = stamps[index] === true;

    const div = document.createElement("div");

    div.className = "spot";

    div.innerHTML = `

      <div class="spot-header">

        <div class="spot-name">

          ${index + 1}. ${spot.name}

        </div>

        <div class="stamp ${completed ? "completed" : ""}">

          ${completed ? "✅ 訪問済み" : "未訪問"}

        </div>

      </div>

      <div class="distance far" id="distance-${index}">

        📍 現在地未確認

      </div>

      <div class="accuracy" id="accuracy-${index}">

      </div>

      <a

        class="map-btn"

        href="https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}"

        target="_blank">

        🗺️ Googleマップで案内

      </a>

      <button

        class="stamp-btn ${completed ? "done" : ""}"

        id="stamp-${index}"

        ${completed ? "disabled" : "disabled"}

        onclick="getStamp(${index})">

        ${completed

          ? "✅ スタンプ取得済み"

          : "🔒 20m以内でスタンプGET"}

      </button>

    `;

    container.appendChild(div);

  });

  updateProgress();

}

/* =========================================

   GPS開始

========================================= */

function startLocation() {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {

    status.textContent =

      "❌ この端末ではGPSを利用できません。";

    return;

  }

  status.textContent =

    "📍 現在地を取得しています…";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      updatePosition(position);

      status.innerHTML =

        "✅ 現在地を確認しました！<br>" +

        "GPS精度：約 " +

        Math.round(position.coords.accuracy) +

        "m";

      /*

       * 現在地を継続監視

       */

      navigator.geolocation.watchPosition(

        function(position) {

          updatePosition(position);

          status.innerHTML =

            "📍 GPS更新中<br>" +

            "GPS精度：約 " +

            Math.round(position.coords.accuracy) +

            "m";

        },

        function(error) {

          console.log(error);

        },

        {

          enableHighAccuracy: true,

          maximumAge: 5000,

          timeout: 15000

        }

      );

    },

    function(error) {

      let message = "";

      if (error.code === 1) {

        message =

          "位置情報が許可されていません。\n" +

          "iPhoneの設定から位置情報を許可してください。";

      } else if (error.code === 2) {

        message =

          "現在地を取得できませんでした。";

      } else if (error.code === 3) {

        message =

          "GPS取得がタイムアウトしました。";

      } else {

        message =

          "現在地を取得できませんでした。";

      }

      status.textContent = "⚠️ " + message;

      alert(message);

    },

    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}

/* =========================================

   現在地更新

========================================= */

function updatePosition(position) {

  currentPosition = {

    lat: position.coords.latitude,

    lng: position.coords.longitude,

    accuracy: position.coords.accuracy

  };

  updateDistances();

}

/* =========================================

   距離計算

========================================= */

function calculateDistance(

  lat1,

  lon1,

  lat2,

  lon2

) {

  const R = 6371000;

  const rad = Math.PI / 180;

  const dLat =

    (lat2 - lat1) * rad;

  const dLon =

    (lon2 - lon1) * rad;

  const a =

    Math.sin(dLat / 2) *

    Math.sin(dLat / 2) +

    Math.cos(lat1 * rad) *

    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *

    Math.sin(dLon / 2);

  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(1 - a)

    );

  return R * c;

}

/* =========================================

   各ポケふたとの距離を更新

========================================= */

function updateDistances() {

  if (!currentPosition) return;

  spots.forEach((spot, index) => {

    const distance =

      calculateDistance(

        currentPosition.lat,

        currentPosition.lng,

        spot.lat,

        spot.lng

      );

    const distanceElement =

      document.getElementById(

        "distance-" + index

      );

    const accuracyElement =

      document.getElementById(

        "accuracy-" + index

      );

    const button =

      document.getElementById(

        "stamp-" + index

      );

    if (!distanceElement || !button) {

      return;

    }

    /* 距離表示 */

    if (distance < 1000) {

      distanceElement.textContent =

        "📏 あと " +

        Math.round(distance) +

        "m";

    } else {

      distanceElement.textContent =

        "📏 約 " +

        (distance / 1000).toFixed(1) +

        "km";

    }

    /* GPS精度 */

    accuracyElement.textContent =

      "GPS精度：約 " +

      Math.round(currentPosition.accuracy) +

      "m";

    /* 20m判定 */

    if (

      distance <= STAMP_DISTANCE &&

      !stamps[index]

    ) {

      distanceElement.className =

        "distance near";

      distanceElement.textContent =

        "🎉 " +

        Math.round(distance) +

        "m！スタンプGETできます！";

      button.disabled = false;

      button.className =

        "stamp-btn ready";

      button.textContent =

        "🎉 スタンプGET！";

    } else {

      distanceElement.className =

        "distance far";

      if (!stamps[index]) {

        button.disabled = true;

        button.className =

          "stamp-btn";

        button.textContent =

          "🔒 20m以内でスタンプGET";

      }

    }

  });

}

/* =========================================

   スタンプ取得

========================================= */

function getStamp(index) {

  if (!currentPosition) {

    alert(

      "まず「📍 現在地を確認」を押してください。"

    );

    return;

  }

  const spot = spots[index];

  const distance =

    calculateDistance(

      currentPosition.lat,

      currentPosition.lng,

      spot.lat,

      spot.lng

    );

  /* 20m以内か最終確認 */

  if (distance > STAMP_DISTANCE) {

    alert(

      "まだ少し離れています。\n\n" +

      "現在の距離：約 " +

      Math.round(distance) +

      "m\n\n" +

      "20m以内まで近づいてください。"

    );

    return;

  }

  /* スタンプ保存 */

  stamps[index] = true;

  localStorage.setItem(

    "pokemonStamps",

    JSON.stringify(stamps)

  );

  renderSpots();

  updateDistances();

  alert(

    "🎉 スタンプGET！\n\n" +

    spot.name +

    " のポケふたを達成しました！"

  );

}

/* =========================================

   進捗更新

========================================= */

function updateProgress() {

  const completed =

    Object.values(stamps)

      .filter(Boolean)

      .length;

  document.getElementById("count")

    .textContent = completed;

  document.getElementById("total")

    .textContent = spots.length;

  const percent =

    (completed / spots.length) * 100;

  document.getElementById("progress")

    .style.width = percent + "%";

}

/* =========================================

   スタンプリセット

========================================= */

function resetStamps() {

  const ok = confirm(

    "本当に全部のスタンプをリセットしますか？"

  );

  if (!ok) return;

  localStorage.removeItem(

    "pokemonStamps"

  );

  stamps = {};

  renderSpots();

  if (currentPosition) {

    updateDistances();

  }

  alert(

    "🔄 スタンプを全部リセットしました！"

  );

}

/* =========================================

   起動

========================================= */

renderSpots();

</script>

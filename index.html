<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>北海道ポケふた巡り</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",

               "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;

  background: #f4f7fb;

  color: #222;

}

header {

  background: linear-gradient(135deg, #38a8ff, #6c63ff);

  color: white;

  padding: 22px 15px;

  text-align: center;

  box-shadow: 0 3px 10px rgba(0,0,0,0.15);

}

header h1 {

  margin: 0;

  font-size: 23px;

}

header p {

  margin: 7px 0 0;

  font-size: 13px;

}

.container {

  max-width: 700px;

  margin: 0 auto;

  padding: 15px;

}

.progress-box {

  background: white;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 15px;

  text-align: center;

  box-shadow: 0 2px 8px rgba(0,0,0,0.08);

}

.progress-number {

  font-size: 28px;

  font-weight: bold;

  color: #4169e1;

}

.progress-bar {

  height: 12px;

  background: #e5e5e5;

  border-radius: 10px;

  overflow: hidden;

  margin-top: 10px;

}

.progress-fill {

  height: 100%;

  width: 0%;

  background: linear-gradient(90deg, #38a8ff, #6c63ff);

  transition: width 0.3s;

}

.location-btn {

  width: 100%;

  border: none;

  border-radius: 14px;

  padding: 16px;

  font-size: 17px;

  font-weight: bold;

  color: white;

  background: #ff6b35;

  margin-bottom: 15px;

  box-shadow: 0 3px 8px rgba(0,0,0,0.15);

}

.location-btn:active {

  transform: scale(0.98);

}

.status {

  background: white;

  border-radius: 12px;

  padding: 13px;

  margin-bottom: 15px;

  text-align: center;

  font-size: 14px;

}

.spot {

  background: white;

  border-radius: 16px;

  padding: 16px;

  margin-bottom: 13px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.08);

}

.spot-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

}

.spot-name {

  font-size: 18px;

  font-weight: bold;

}

.stamp {

  font-size: 12px;

  font-weight: bold;

  padding: 6px 9px;

  border-radius: 20px;

  background: #eee;

  color: #777;

  white-space: nowrap;

}

.stamp.completed {

  background: #d9f7df;

  color: #159447;

}

.address {

  margin-top: 8px;

  font-size: 13px;

  color: #666;

  line-height: 1.5;

}

.distance {

  margin-top: 8px;

  font-size: 13px;

  color: #4169e1;

  font-weight: bold;

}

.map-btn {

  display: block;

  text-align: center;

  text-decoration: none;

  background: #4285f4;

  color: white;

  padding: 12px;

  border-radius: 10px;

  margin-top: 12px;

  font-weight: bold;

}

.stamp-btn {

  width: 100%;

  border: none;

  padding: 12px;

  margin-top: 10px;

  border-radius: 10px;

  font-size: 15px;

  font-weight: bold;

  background: #ddd;

  color: #888;

}

.stamp-btn.ready {

  background: #4caf50;

  color: white;

}

.stamp-btn.done {

  background: #eee;

  color: #159447;

}

.reset-btn {

  width: 100%;

  border: none;

  background: #777;

  color: white;

  padding: 13px;

  border-radius: 10px;

  margin: 20px 0 30px;

  font-size: 14px;

}

</style>

</head>

<body>

<header>

  <h1>🏔️ 北海道ポケふた巡り</h1>

  <p>北海道のポケふたを集めよう！</p>

</header>

<div class="container">

  <div class="progress-box">

    <div>🎉 スタンプ達成状況</div>

    <div class="progress-number">

      <span id="count">0</span> / <span id="total">50</span>

    </div>

    <div class="progress-bar">

      <div class="progress-fill" id="progress"></div>

    </div>

  </div>

  <button class="location-btn" onclick="getLocation()">

    📍 現在地を確認

  </button>

  <div class="status" id="status">

    現在地を確認すると、各ポケふたとの距離を表示します。

  </div>

  <div id="spots"></div>

  <button class="reset-btn" onclick="resetStamps()">

    🔄 スタンプを全部リセット

  </button>

</div>

<script>

/* =========================

   北海道ポケふた 50か所

========================= */

const spots = [

  ["別海町", "北海道別海町"],

  ["湧別町", "北海道湧別町中湧別中町3020番地の1"],

  ["津別町", "北海道津別町共和127番地1"],

  ["幌延町", "北海道幌延町"],

  ["厚沢部町", "北海道厚沢部町"],

  ["由仁町", "北海道由仁町"],

  ["砂川市", "北海道砂川市西1条北2丁目1番20号"],

  ["札幌市", "北海道札幌市"],

  ["美瑛町", "北海道美瑛町"],

  ["美幌町", "北海道美幌町"],

  ["猿払村", "北海道猿払村"],

  ["木古内町", "北海道木古内町"],

  ["歌志内市", "北海道歌志内市"],

  ["北見市", "北海道北見市"],

  ["室蘭市", "北海道室蘭市"],

  ["当別町", "北海道当別町"],

  ["えりも町", "北海道えりも町本町53-1"],

  ["斜里町", "北海道斜里町"],

  ["東川町", "北海道東川町"],

  ["赤井川村", "北海道赤井川村"],

  ["網走市", "北海道網走市"],

  ["帯広市", "北海道帯広市"],

  ["釧路市", "北海道釧路市"],

  ["旭川市", "北海道旭川市神楽4条6丁目1-12"],

  ["中標津町", "北海道中標津町"],

  ["陸別町", "北海道陸別町"],

  ["本別町", "北海道本別町北3丁目1-2"],

  ["登別市", "北海道登別市"],

  ["根室市", "北海道根室市"],

  ["小樽市", "北海道小樽市"],

  ["函館市", "北海道函館市青柳町17"],

  ["剣淵町", "北海道剣淵町"],

  ["上富良野町", "北海道上富良野町"],

  ["三笠市", "北海道三笠市"],

  ["苫小牧市", "北海道苫小牧市"],

  ["足寄町", "北海道足寄町"],

  ["新得町", "北海道新得町"],

  ["大空町", "北海道大空町"],

  ["遠軽町", "北海道遠軽町"],

  ["紋別市", "北海道紋別市"],

  ["豊富町", "北海道豊富町"],

  ["稚内市", "北海道稚内市"],

  ["天塩町", "北海道天塩町"],

  ["比布町", "北海道比布町"],

  ["士別市", "北海道士別市"],

  ["上ノ国町", "北海道上ノ国町"],

  ["森町", "北海道森町"],

  ["洞爺湖町", "北海道洞爺湖町"],

  ["恵庭市", "北海道恵庭市"],

  ["石狩市", "北海道石狩市"]

];

/* =========================

   スタンプ保存

========================= */

let stamps = JSON.parse(

  localStorage.getItem("pokemonStamps") || "{}"

);

/* =========================

   一覧表示

========================= */

function renderSpots() {

  const container = document.getElementById("spots");

  container.innerHTML = "";

  spots.forEach((spot, index) => {

    const name = spot[0];

    const address = spot[1];

    const completed = stamps[index] === true;

    const div = document.createElement("div");

    div.className = "spot";

    div.innerHTML = `

      <div class="spot-header">

        <div class="spot-name">

          ${index + 1}. ${name}

        </div>

        <div class="stamp ${completed ? "completed" : ""}">

          ${completed ? "✅ 訪問済み" : "未訪問"}

        </div>

      </div>

      <div class="address">

        📍 ${address}

      </div>

      <div class="distance" id="distance-${index}">

        距離：現在地未確認

      </div>

      <a

        class="map-btn"

        href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}"

        target="_blank">

        🗺️ Googleマップで場所を見る

      </a>

      <button

        class="stamp-btn ${completed ? "done" : ""}"

        id="stamp-${index}"

        onclick="manualStamp(${index})">

        ${completed ? "✅ スタンプ取得済み" : "📸 ポケふたを見つけた！"}

      </button>

    `;

    container.appendChild(div);

  });

  updateProgress();

}

/* =========================

   スタンプ

========================= */

function manualStamp(index) {

  if (stamps[index]) {

    alert("このポケふたは、すでにスタンプ取得済みです！");

    return;

  }

  const ok = confirm(

    spots[index][0] +

    " のポケふたを見つけましたか？\n\n" +

    "「OK」でスタンプを取得します。"

  );

  if (!ok) return;

  stamps[index] = true;

  localStorage.setItem(

    "pokemonStamps",

    JSON.stringify(stamps)

  );

  renderSpots();

  alert(

    "🎉 スタンプGET！\n\n" +

    spots[index][0] +

    " のポケふたを達成しました！"

  );

}

/* =========================

   現在地取得

========================= */

function getLocation() {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {

    status.textContent =

      "この端末では現在地機能を利用できません。";

    return;

  }

  status.textContent =

    "📍 現在地を確認しています…";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;

      const lng = position.coords.longitude;

      status.innerHTML =

        "✅ 現在地を確認しました！<br>" +

        "緯度：" + lat.toFixed(6) +

        "　経度：" + lng.toFixed(6);

      /*

       * 今回は住所をGoogleマップへ渡す方式のため、

       * 各ポケふたの正確なGPS座標が確認できた場所以外は

       * 距離を計算しません。

       */

      document.querySelectorAll(".distance")

        .forEach(function(el) {

          el.textContent =

            "📍 場所はGoogleマップで確認できます";

        });

    },

    function(error) {

      let message = "";

      switch(error.code) {

        case 1:

          message =

            "現在地の利用が許可されていません。\n" +

            "iPhoneの設定から位置情報を許可してください。";

          break;

        case 2:

          message =

            "現在地を取得できませんでした。";

          break;

        case 3:

          message =

            "現在地の取得がタイムアウトしました。";

          break;

        default:

          message =

            "現在地を取得できませんでした。";

      }

      status.textContent = "⚠️ " + message;

      alert(message);

    },

    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}

/* =========================

   進捗表示

========================= */

function updateProgress() {

  const completed =

    Object.values(stamps).filter(Boolean).length;

  document.getElementById("count").textContent =

    completed;

  document.getElementById("total").textContent =

    spots.length;

  const percent =

    (completed / spots.length) * 100;

  document.getElementById("progress").style.width =

    percent + "%";

}

/* =========================

   リセット

========================= */

function resetStamps() {

  const ok = confirm(

    "本当に全部のスタンプをリセットしますか？"

  );

  if (!ok) return;

  localStorage.removeItem("pokemonStamps");

  stamps = {};

  renderSpots();

  alert("スタンプをリセットしました！");

}

/* =========================

   起動

========================= */

renderSpots();

</script>

</body>

</html>

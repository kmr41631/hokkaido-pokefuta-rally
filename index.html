<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1683ff">

<title>北海道ポケふた巡り</title>

<!-- Leaflet -->

<link

  rel="stylesheet"

  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

/>

<style>

* {

  box-sizing: border-box;

}

html {

  scroll-behavior: smooth;

}

body {

  margin: 0;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Helvetica Neue",

    "Hiragino Kaku Gothic ProN",

    "Yu Gothic",

    sans-serif;

  background: #f3f7fc;

  color: #222;

}

/* =========================

   ヘッダー

========================= */

header {

  background:

    linear-gradient(135deg, #1683ff 0%, #5268ff 55%, #7658ff 100%);

  color: white;

  padding: 24px 16px 22px;

  text-align: center;

  box-shadow: 0 3px 15px rgba(0,0,0,.12);

}

header h1 {

  margin: 0;

  font-size: 24px;

  letter-spacing: .5px;

}

header p {

  margin: 7px 0 0;

  font-size: 13px;

  opacity: .95;

}

/* =========================

   全体

========================= */

.container {

  width: 100%;

  max-width: 760px;

  margin: auto;

  padding: 14px;

}

/* =========================

   進捗

========================= */

.progress-box {

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 14px;

  box-shadow: 0 3px 12px rgba(0,0,0,.07);

}

.progress-top {

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.progress-title {

  font-size: 14px;

  font-weight: bold;

}

.progress-number {

  font-size: 25px;

  font-weight: 800;

  color: #4169e1;

}

.progress-bar {

  height: 12px;

  background: #e9edf3;

  border-radius: 20px;

  overflow: hidden;

  margin-top: 10px;

}

.progress-fill {

  width: 0%;

  height: 100%;

  background:

    linear-gradient(90deg, #21a1ff, #635bff);

  border-radius: 20px;

  transition: width .4s ease;

}

.progress-percent {

  text-align: right;

  margin-top: 6px;

  font-size: 11px;

  color: #888;

}

/* =========================

   現在地

========================= */

.location-btn {

  width: 100%;

  border: none;

  border-radius: 15px;

  padding: 16px;

  font-size: 17px;

  font-weight: 800;

  color: white;

  background: #ff6638;

  box-shadow: 0 4px 10px rgba(255,102,56,.2);

}

.location-btn:active {

  transform: scale(.98);

}

.status {

  background: white;

  border-radius: 14px;

  padding: 13px;

  margin: 12px 0 14px;

  text-align: center;

  font-size: 13px;

  line-height: 1.6;

  box-shadow: 0 2px 8px rgba(0,0,0,.05);

}

/* =========================

   メインタブ

========================= */

.main-tabs {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 8px;

  margin-bottom: 14px;

}

.main-tab {

  border: none;

  border-radius: 13px;

  padding: 13px 8px;

  background: white;

  color: #666;

  font-size: 14px;

  font-weight: 800;

  box-shadow: 0 2px 8px rgba(0,0,0,.06);

}

.main-tab.active {

  background: #4169e1;

  color: white;

}

/* =========================

   地図

========================= */

.map-section {

  display: none;

}

.map-section.active {

  display: block;

}

.map-box {

  background: white;

  border-radius: 18px;

  padding: 8px;

  box-shadow: 0 3px 12px rgba(0,0,0,.08);

  overflow: hidden;

}

#map {

  width: 100%;

  height: 500px;

  border-radius: 14px;

}

.map-info {

  padding: 10px 5px 3px;

  text-align: center;

  font-size: 12px;

  color: #777;

}

.map-legend {

  display: flex;

  justify-content: center;

  gap: 14px;

  padding: 8px 0 4px;

  font-size: 12px;

}

.legend-item {

  display: flex;

  align-items: center;

  gap: 5px;

}

.legend-dot {

  width: 11px;

  height: 11px;

  border-radius: 50%;

}

.legend-dot.done {

  background: #21a85b;

}

.legend-dot.todo {

  background: #999;

}

.legend-dot.me {

  background: #1683ff;

}

/* =========================

   一覧

========================= */

.list-section {

  display: none;

}

.list-section.active {

  display: block;

}

/* =========================

   フィルター

========================= */

.filter-tabs {

  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 7px;

  margin-bottom: 12px;

}

.filter-tab {

  border: none;

  background: white;

  color: #666;

  padding: 12px 5px;

  border-radius: 12px;

  font-size: 12px;

  font-weight: 800;

  box-shadow: 0 2px 7px rgba(0,0,0,.06);

}

.filter-tab.active {

  background: #222;

  color: white;

}

.filter-count {

  font-size: 10px;

  opacity: .75;

}

/* =========================

   検索

========================= */

.search-box {

  background: white;

  border-radius: 16px;

  padding: 12px;

  margin-bottom: 12px;

  box-shadow: 0 2px 8px rgba(0,0,0,.06);

}

.search-input {

  width: 100%;

  border: 2px solid #e4e8ef;

  border-radius: 12px;

  padding: 13px;

  font-size: 16px;

  outline: none;

}

.search-input:focus {

  border-color: #4169e1;

}

.sort-buttons {

  display: flex;

  gap: 7px;

  margin-top: 9px;

}

.sort-btn {

  flex: 1;

  border: none;

  border-radius: 10px;

  padding: 10px 4px;

  background: #eee;

  color: #666;

  font-size: 12px;

  font-weight: 800;

}

.sort-btn.active {

  background: #4169e1;

  color: white;

}

.search-result {

  text-align: center;

  margin-top: 8px;

  font-size: 12px;

  color: #888;

}

/* =========================

   カード

========================= */

.spot {

  background: white;

  border-radius: 18px;

  padding: 13px;

  margin-bottom: 13px;

  box-shadow: 0 3px 12px rgba(0,0,0,.07);

}

.spot-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

}

.spot-name {

  font-size: 18px;

  font-weight: 800;

}

.stamp {

  white-space: nowrap;

  padding: 6px 9px;

  border-radius: 20px;

  background: #eee;

  color: #777;

  font-size: 11px;

  font-weight: 800;

}

.stamp.completed {

  background: #d8f7e2;

  color: #138a47;

}

/* =========================

   ポケふたカード

========================= */

.pokefuta-card {

  width: 100%;

  height: 235px;

  margin-bottom: 13px;

  perspective: 1200px;

}

.pokefuta-inner {

  position: relative;

  width: 100%;

  height: 100%;

  transition: transform .9s cubic-bezier(.2,.7,.2,1);

  transform-style: preserve-3d;

}

.pokefuta-card.flipped .pokefuta-inner {

  transform: rotateY(180deg);

}

.card-face {

  position: absolute;

  inset: 0;

  border-radius: 17px;

  overflow: hidden;

  backface-visibility: hidden;

  -webkit-backface-visibility: hidden;

}

/* 未取得側 */

.card-back {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  color: white;

  background:

    radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 30%),

    linear-gradient(135deg, #182131, #090d15);

  border: 2px solid #4d5d82;

}

.lock-icon {

  font-size: 46px;

  margin-bottom: 8px;

}

.lock-title {

  font-size: 21px;

  font-weight: 900;

}

.lock-sub {

  margin-top: 6px;

  font-size: 11px;

  color: #aeb8cb;

}

/* 取得側 */

.card-front {

  transform: rotateY(180deg);

  background:

    linear-gradient(135deg, #f7fcff, #e8f4ff);

  border: 2px solid #35a5ff;

  display: flex;

  align-items: center;

  justify-content: center;

}

.card-front-content {

  width: 100%;

  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding: 15px;

  text-align: center;

}

.actual-image {

  max-width: 180px;

  max-height: 165px;

  width: auto;

  height: auto;

  object-fit: contain;

  border-radius: 12px;

}

.no-image {

  font-size: 14px;

  color: #777;

  line-height: 1.6;

}

.official-link {

  display: inline-block;

  margin-top: 9px;

  text-decoration: none;

  background: #4169e1;

  color: white;

  padding: 9px 13px;

  border-radius: 10px;

  font-size: 12px;

  font-weight: bold;

}

/* =========================

   距離

========================= */

.distance {

  margin-top: 7px;

  font-size: 15px;

  font-weight: 800;

  color: #777;

}

.distance.near {

  color: #159447;

}

.accuracy {

  margin-top: 3px;

  font-size: 11px;

  color: #999;

}

/* =========================

   地図ボタン

========================= */

.map-buttons {

  display: flex;

  gap: 7px;

  margin-top: 11px;

}

.map-btn {

  flex: 1;

  display: block;

  text-align: center;

  text-decoration: none;

  color: white;

  background: #4285f4;

  border-radius: 10px;

  padding: 11px 4px;

  font-size: 12px;

  font-weight: 800;

}

.map-btn.apple {

  background: #222;

}

/* =========================

   GETボタン

========================= */

.stamp-btn {

  width: 100%;

  border: none;

  border-radius: 11px;

  padding: 13px;

  margin-top: 9px;

  background: #e1e1e1;

  color: #888;

  font-size: 14px;

  font-weight: 900;

}

.stamp-btn.ready {

  background: #32a852;

  color: white;

  box-shadow: 0 4px 12px rgba(50,168,82,.25);

}

.stamp-btn.done {

  background: #e9f7ee;

  color: #159447;

}

/* =========================

   空結果

========================= */

.no-result {

  background: white;

  border-radius: 17px;

  padding: 35px 15px;

  text-align: center;

  color: #777;

}

/* =========================

   リセット

========================= */

.reset-btn {

  width: 100%;

  border: none;

  border-radius: 11px;

  background: #777;

  color: white;

  padding: 13px;

  margin: 18px 0 30px;

  font-size: 13px;

}

/* =========================

   Leaflet マーカー

========================= */

.custom-marker {

  width: 30px;

  height: 30px;

  border-radius: 50% 50% 50% 0;

  transform: rotate(-45deg);

  border: 3px solid white;

  box-shadow: 0 2px 7px rgba(0,0,0,.35);

}

.custom-marker-inner {

  width: 100%;

  height: 100%;

  border-radius: 50%;

}

.custom-marker.done {

  background: #21a85b;

}

.custom-marker.todo {

  background: #777;

}

.custom-marker.me {

  background: #1683ff;

  border-radius: 50%;

  transform: none;

}

/* =========================

   モーダル

========================= */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 9999;

  background: rgba(0,0,0,.55);

  align-items: flex-end;

  justify-content: center;

}

.modal.show {

  display: flex;

}

.modal-content {

  width: 100%;

  max-width: 760px;

  background: white;

  border-radius: 22px 22px 0 0;

  padding: 20px;

  max-height: 85vh;

  overflow-y: auto;

}

.modal-close {

  width: 100%;

  border: none;

  border-radius: 11px;

  padding: 13px;

  background: #eee;

  font-weight: bold;

  margin-top: 12px;

}

.modal-title {

  font-size: 21px;

  font-weight: 900;

}

.modal-text {

  margin-top: 7px;

  color: #777;

  font-size: 13px;

  line-height: 1.6;

}

.modal-actions {

  display: flex;

  gap: 8px;

  margin-top: 13px;

}

.modal-action {

  flex: 1;

  border: none;

  border-radius: 11px;

  padding: 12px 5px;

  color: white;

  background: #4169e1;

  font-weight: bold;

  text-decoration: none;

  text-align: center;

  font-size: 12px;

}

/* =========================

   スマホ

========================= */

@media (max-width: 600px) {

  #map {

    height: 430px;

  }

  .pokefuta-card {

    height: 215px;

  }

  .actual-image {

    max-width: 165px;

    max-height: 145px;

  }

}

</style>

</head>

<body>

<header>

  <h1>🏔️ 北海道ポケふた巡り</h1>

  <p>北海道50か所を巡ってコンプリート！</p>

</header>

<div class="container">

  <!-- 進捗 -->

  <div class="progress-box">

    <div class="progress-top">

      <div class="progress-title">🎉 ポケふた達成状況</div>

      <div class="progress-number">

        <span id="count">0</span> / <span id="total">50</span>

      </div>

    </div>

    <div class="progress-bar">

      <div class="progress-fill" id="progress"></div>

    </div>

    <div class="progress-percent" id="progressPercent">

      0%

    </div>

  </div>

  <!-- 現在地 -->

  <button

    class="location-btn"

    onclick="startLocation()">

    📍 現在地を確認

  </button>

  <div class="status" id="status">

    「現在地を確認」を押してください。

  </div>

  <!-- メインタブ -->

  <div class="main-tabs">

    <button

      id="tabMap"

      class="main-tab active"

      onclick="switchMainTab('map')">

      🗾 北海道マップ

    </button>

    <button

      id="tabList"

      class="main-tab"

      onclick="switchMainTab('list')">

      📸 ポケふた一覧

    </button>

  </div>

  <!-- ======================

       地図

  ======================= -->

  <section

    id="mapSection"

    class="map-section active">

    <div class="map-box">

      <div id="map"></div>

      <div class="map-legend">

        <div class="legend-item">

          <span class="legend-dot done"></span>

          訪問済み

        </div>

        <div class="legend-item">

          <span class="legend-dot todo"></span>

          未訪問

        </div>

        <div class="legend-item">

          <span class="legend-dot me"></span>

          現在地

        </div>

      </div>

      <div class="map-info">

        マーカーをタップするとポケふたの詳細を確認できます

      </div>

    </div>

  </section>

  <!-- ======================

       一覧

  ======================= -->

  <section

    id="listSection"

    class="list-section">

    <!-- 行った / 行ってない -->

    <div class="filter-tabs">

      <button

        id="filterAll"

        class="filter-tab active"

        onclick="setFilter('all')">

        すべて

        <div class="filter-count" id="allCount">50</div>

      </button>

      <button

        id="filterTodo"

        class="filter-tab"

        onclick="setFilter('todo')">

        行ってない

        <div class="filter-count" id="todoCount">50</div>

      </button>

      <button

        id="filterDone"

        class="filter-tab"

        onclick="setFilter('done')">

        行った

        <div class="filter-count" id="doneCount">0</div>

      </button>

    </div>

    <!-- 検索 -->

    <div class="search-box">

      <input

        id="searchInput"

        class="search-input"

        type="text"

        placeholder="🔎 市町村を検索（例：旭川）"

        oninput="renderSpots()"

      >

      <div class="sort-buttons">

        <button

          id="sortDefault"

          class="sort-btn active"

          onclick="setSortMode('default')">

          🔢 元の順番

        </button>

        <button

          id="sortDistance"

          class="sort-btn"

          onclick="setSortMode('distance')">

          📍 近い順

        </button>

      </div>

      <div

        class="search-result"

        id="searchResult">

        全50か所

      </div>

    </div>

    <div id="spots"></div>

    <button

      class="reset-btn"

      onclick="resetStamps()">

      🔄 スタンプを全部リセット

    </button>

  </section>

</div>

<!-- ======================

     詳細モーダル

====================== -->

<div

  id="detailModal"

  class="modal"

  onclick="closeModal(event)">

  <div

    class="modal-content"

    onclick="event.stopPropagation()">

    <div

      class="modal-title"

      id="modalTitle">

    </div>

    <div

      class="modal-text"

      id="modalText">

    </div>

    <div class="modal-actions">

      <a

        id="modalApple"

        class="modal-action"

        target="_blank">

        🍎 Appleマップ

      </a>

      <a

        id="modalGoogle"

        class="modal-action"

        target="_blank">

        🗺️ Googleマップ

      </a>

    </div>

    <button

      class="modal-close"

      onclick="closeModal()">

      閉じる

    </button>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* =====================================================

   設定

===================================================== */

const STAMP_DISTANCE = 20;

let currentPosition = null;

let userMarker = null;

let sortMode = "default";

let currentFilter = "all";

let map = null;

let markers = [];

let stamps = JSON.parse(

  localStorage.getItem("pokemonStamps") || "{}"

);

/* =====================================================

   初期化

===================================================== */

document.addEventListener("DOMContentLoaded", () => {

  document.getElementById("total").textContent =

    spots.length;

  initMap();

  updateCounts();

  renderSpots();

});

/* =====================================================

   地図初期化

===================================================== */

function initMap() {

  map = L.map("map", {

    zoomControl: true

  }).setView(

    [43.35, 142.8],

    7

  );

  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom: 19,

      attribution:

        '&copy; OpenStreetMap contributors'

    }

  ).addTo(map);

  renderMapMarkers();

}

/* =====================================================

   マーカー作成

===================================================== */

function createMarkerIcon(completed) {

  const className =

    completed

      ? "custom-marker done"

      : "custom-marker todo";

  return L.divIcon({

    className: "",

    html:

      `<div class="${className}">

        <div class="custom-marker-inner"></div>

      </div>`,

    iconSize: [30, 42],

    iconAnchor: [15, 42],

    popupAnchor: [0, -40]

  });

}

/* =====================================================

   地図マーカー更新

===================================================== */

function renderMapMarkers() {

  if (!map) return;

  markers.forEach(marker => {

    map.removeLayer(marker);

  });

  markers = [];

  spots.forEach((spot, index) => {

    const completed =

      stamps[index] === true;

    const marker =

      L.marker(

        [spot.lat, spot.lng],

        {

          icon:

            createMarkerIcon(completed)

        }

      ).addTo(map);

    marker.bindPopup(`

      <div style="min-width:180px">

        <strong style="font-size:16px">

          ${index + 1}. ${spot.name}

        </strong>

        <div style="margin-top:6px">

          ${

            completed

              ? "🟢 訪問済み"

              : "⚪ 未訪問"

          }

        </div>

        <button

          onclick="openSpot(${index})"

          style="

            margin-top:8px;

            width:100%;

            padding:8px;

            border:none;

            border-radius:8px;

            background:#4169e1;

            color:white;

            font-weight:bold;

          ">

          詳細を見る

        </button>

      </div>

    `);

    markers.push(marker);

  });

}

/* =====================================================

===================================================== */

function switchMainTab(tab) {

  const mapSection =

    document.getElementById("mapSection");

  const listSection =

    document.getElementById("listSection");

  const tabMap =

    document.getElementById("tabMap");

  const tabList =

    document.getElementById("tabList");

  if (tab === "map") {

    mapSection.classList.add("active");

    listSection.classList.remove("active");

    tabMap.classList.add("active");

    tabList.classList.remove("active");

    setTimeout(() => {

      map.invalidateSize();

    }, 100);

  } else {

    mapSection.classList.remove("active");

    listSection.classList.add("active");

    tabMap.classList.remove("active");

    tabList.classList.add("active");

  }

}

  currentFilter = filter;

    .getElementById("filterAll")

      filter === "all"

    );

  document

    .getElementById("filterTodo")

    .classList.toggle(

      filter === "todo"

    .getElementById("filterDone")

    .classList.toggle(

      "active",

      filter === "done"

}

      mode === "default"

    );

  document

    .getElementById("sortDistance")

    .classList.toggle(

}

/* =====================================================

   一覧表示

===================================================== */

function renderSpots() {

  const container =

    document.getElementById("spots");

  const searchInput =

    document.getElementById("searchInput");

  const searchWord =

    searchInput.value

      .trim()

      .toLowerCase();

  let displaySpots =

    spots.map((spot, index) => {

      let distance = null;

      if (currentPosition) {

        distance =

          calculateDistance(

            currentPosition.lat,

            currentPosition.lng,

            spot.lat,

            spot.lng

          );

      }

      return {

        spot,

        index,

        distance

      };

    });

  /* フィルター */

  if (currentFilter === "todo") {

    displaySpots =

      displaySpots.filter(

        item =>

          stamps[item.index] !== true

      );

  }

  if (currentFilter === "done") {

    displaySpots =

      displaySpots.filter(

        item =>

          stamps[item.index] === true

      );

  }

  /* 検索 */

  if (searchWord) {

    displaySpots =

      displaySpots.filter(item =>

        item.spot.name

          .toLowerCase()

          .includes(searchWord)

      );

  }

  /* 近い順 */

  if (

    sortMode === "distance" &&

    currentPosition

  ) {

    displaySpots.sort(

      (a, b) =>

        a.distance - b.distance

    );

  }

  document.getElementById(

    "searchResult"

  ).textContent =

    displaySpots.length +

    "か所";

  if (displaySpots.length === 0) {

    container.innerHTML = `

      <div class="no-result">

        🔎 該当するポケふたがありません

      </div>

    `;

    return;

  }

  container.innerHTML = "";

  displaySpots.forEach(item => {

    const spot = item.spot;

    const index = item.index;

    const completed =

      stamps[index] === true;

    const div =

      document.createElement("div");

    div.className = "spot";

    div.innerHTML = `

      <!-- ポケふたカード -->

      <div

        class="pokefuta-card

        ${completed ? "flipped" : ""}"

        id="card-${index}">

        <div class="pokefuta-inner">

          <!-- 未取得面 -->

          <div class="card-face card-back">

            <div class="lock-icon">

              🔒

            </div>

            <div class="lock-title">

              未取得

            </div>

            <div class="lock-sub">

              現地で20m以内になるとGETできます

            </div>

          </div>

          <!-- 取得面 -->

          <div class="card-face card-front">

            <div class="card-front-content">

              ${

                completed

                  ? `

                    <div style="

                      font-size:12px;

                      color:#159447;

                      font-weight:bold;

                      margin-bottom:5px;">

                      🎉 GET COMPLETE

                    </div>

                    <div style="

                      font-size:22px;

                      font-weight:900;">

                      ${spot.name}

                    </div>

                    <a

                      href="${spot.official}"

                      target="_blank"

                      class="official-link">

                      📸 公式ポケふたを見る

                    </a>

                  `

                  : ""

              }

            </div>

          </div>

        </div>

      </div>

      <!-- 市町村 -->

      <div class="spot-header">

        <div class="spot-name">

          ${index + 1}. ${spot.name}

        </div>

        <div

          class="stamp

          ${completed ? "completed" : ""}">

          ${

            completed

              ? "✅ 訪問済み"

              : "未訪問"

          }

        </div>

      </div>

      <!-- 距離 -->

      <div

        class="distance far"

        id="distance-${index}">

        📍 現在地未確認

      </div>

      <div

        class="accuracy"

        id="accuracy-${index}">

      </div>

      <!-- マップ -->

      <div class="map-buttons">

        <a

          class="map-btn apple"

          href="http://maps.apple.com/?daddr=${spot.lat},${spot.lng}&dirflg=d"

          target="_blank">

          🍎 Appleマップ

        </a>

        <a

          class="map-btn"

          href="https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}"

          target="_blank">

          🗺️ Googleマップ

        </a>

      </div>

      <!-- GET -->

      <button

        class="stamp-btn

        ${completed ? "done" : ""}"

        id="stamp-${index}"

        ${completed ? "disabled" : "disabled"}

        onclick="getStamp(${index})">

        ${

          completed

            ? "✅ スタンプ取得済み"

            : "🔒 20m以内でスタンプGET"

        }

      </button>

    `;

    container.appendChild(div);

  });

  updateDistances();

}

/* =====================================================

   現在地取得

===================================================== */

function startLocation() {

  const status =

    document.getElementById("status");

  if (!navigator.geolocation) {

    status.textContent =

      "❌ この端末ではGPSを利用できません。";

    return;

  }

  status.textContent =

    "📍 現在地を取得しています…";

  navigator.geolocation.getCurrentPosition(

    position => {

      updatePosition(position);

      status.innerHTML =

        "✅ 現在地を確認しました！<br>" +

        "GPS精度：約 " +

        Math.round(

          position.coords.accuracy

        ) +

        "m";

      navigator.geolocation.watchPosition(

        position => {

          updatePosition(position);

          status.innerHTML =

            "📍 GPS更新中<br>" +

            "GPS精度：約 " +

            Math.round(

              position.coords.accuracy

            ) +

            "m";

        },

        error => {

          console.log(error);

        },

        {

          enableHighAccuracy: true,

          maximumAge: 3000,

          timeout: 15000

        }

      );

    },

    error => {

      let message =

        "現在地を取得できませんでした。";

      if (error.code === 1) {

        message =

          "位置情報が許可されていません。\n" +

          "iPhoneの設定から位置情報を許可してください。";

      }

      if (error.code === 2) {

        message =

          "現在地を取得できませんでした。";

      }

      if (error.code === 3) {

        message =

          "GPS取得がタイムアウトしました。";

      }

      status.textContent =

        "⚠️ " + message;

      alert(message);

    },

    {

      enableHighAccuracy: true,

      timeout: 20000,

      maximumAge: 0

    }

  );

}

/* =====================================================

   現在地更新

===================================================== */

function updatePosition(position) {

  currentPosition = {

    lat:

      position.coords.latitude,

    lng:

      position.coords.longitude,

    accuracy:

      position.coords.accuracy

  };

  updateUserMarker();

  if (sortMode === "distance") {

    renderSpots();

  } else {

    updateDistances();

  }

}

/* =====================================================

   現在地マーカー

===================================================== */

function updateUserMarker() {

  if (!map || !currentPosition) {

    return;

  }

  if (userMarker) {

    map.removeLayer(userMarker);

  }

  const icon =

    L.divIcon({

      className: "",

      html:

        `<div class="custom-marker me"></div>`,

      iconSize: [30,30],

      iconAnchor: [15,15]

    });

  userMarker =

    L.marker(

      [

        currentPosition.lat,

        currentPosition.lng

      ],

      {

        icon

      }

    ).addTo(map);

  userMarker.bindPopup(

    "📍 現在地"

  );

}

/* =====================================================

   距離計算

===================================================== */

function calculateDistance(

  lat1,

  lon1,

  lat2,

  lon2

) {

  const R = 6371000;

  const rad =

    Math.PI / 180;

  const dLat =

    (lat2 - lat1) * rad;

  const dLon =

    (lon2 - lon1) * rad;

  const a =

    Math.sin(dLat / 2) *

    Math.sin(dLat / 2) +

    Math.cos(lat1 * rad) *

    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *

    Math.sin(dLon / 2);

  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(1 - a)

    );

  return R * c;

}

/* =====================================================

   距離表示

===================================================== */

function updateDistances() {

  if (!currentPosition) {

    return;

  }

  spots.forEach(

    (spot, index) => {

      const distance =

        calculateDistance(

          currentPosition.lat,

          currentPosition.lng,

          spot.lat,

          spot.lng

        );

      const distanceElement =

        document.getElementById(

          "distance-" + index

        );

      const accuracyElement =

        document.getElementById(

          "accuracy-" + index

        );

      const button =

        document.getElementById(

          "stamp-" + index

        );

      if (

        !distanceElement ||

        !button

      ) {

        return;

      }

      if (distance < 1000) {

        distanceElement.textContent =

          "📏 あと " +

          Math.round(distance) +

          "m";

      } else {

        distanceElement.textContent =

          "📏 約 " +

          (distance / 1000)

            .toFixed(1) +

          "km";

      }

      accuracyElement.textContent =

        "GPS精度：約 " +

        Math.round(

          currentPosition.accuracy

        ) +

        "m";

      if (

        distance <= STAMP_DISTANCE &&

        !stamps[index]

      ) {

        distanceElement.className =

          "distance near";

        distanceElement.textContent =

          "🎉 " +

          Math.round(distance) +

          "m！スタンプGETできます！";

        button.disabled = false;

        button.className =

          "stamp-btn ready";

        button.textContent =

          "🎉 スタンプGET！";

      } else {

        distanceElement.className =

          "distance far";

        if (!stamps[index]) {

          button.disabled = true;

          button.className =

            "stamp-btn";

          button.textContent =

            "🔒 20m以内でスタンプGET";

        }

      }

    }

  );

}

/* =====================================================

   スタンプ取得

===================================================== */

function getStamp(index) {

  if (!currentPosition) {

    alert(

      "まず「📍 現在地を確認」を押してください。"

    );

    return;

  }

  const spot =

    spots[index];

  const distance =

    calculateDistance(

      currentPosition.lat,

      currentPosition.lng,

      spot.lat,

      spot.lng

    );

  if (

    distance > STAMP_DISTANCE

  ) {

    alert(

      "まだ少し離れています。\n\n" +

      "現在の距離：約 " +

      Math.round(distance) +

      "m\n\n" +

      "20m以内まで近づいてください。"

    );

    return;

  }

  if (stamps[index]) {

    return;

  }

  /* 保存 */

  stamps[index] = true;

  localStorage.setItem(

    "pokemonStamps",

    JSON.stringify(stamps)

  );

  /* まず現在のカードを回転 */

  const card =

    document.getElementById(

      "card-" + index

    );

  if (card) {

    card.classList.add(

      "flipped"

    );

  }

  /* 進捗 */

  updateCounts();

  renderMapMarkers();

  /* 少し待ってから一覧を再描画 */

  setTimeout(() => {

    renderSpots();

  }, 950);

  alert(

    "🎉 スタンプGET！\n\n" +

    spot.name +

    " のポケふたを達成しました！"

  );

}

/* =====================================================

   進捗

===================================================== */

function updateCounts() {

  const completed =

    spots.filter(

      (_, index) =>

        stamps[index] === true

    ).length;

  const total =

    spots.length;

  const todo =

    total - completed;

  document.getElementById(

    "count"

  ).textContent = completed;

  document.getElementById(

    "total"

  ).textContent = total;

  document.getElementById(

    "doneCount"

  ).textContent = completed;

  document.getElementById(

    "todoCount"

  ).textContent = todo;

  document.getElementById(

    "allCount"

  ).textContent = total;

  const percent =

    total === 0

      ? 0

      : (completed / total) * 100;

  document.getElementById(

    "progress"

  ).style.width =

    percent + "%";

  document.getElementById(

    "progressPercent"

  ).textContent =

    Math.round(percent) +

    "% COMPLETE";

}

/* =====================================================

   地図から詳細

===================================================== */

function openSpot(index) {

  const spot =

    spots[index];

  const completed =

    stamps[index] === true;

  document.getElementById(

    "modalTitle"

  ).textContent =

    spot.name;

  document.getElementById(

    "modalText"

  ).innerHTML =

    completed

      ? "🟢 このポケふたは訪問済みです。"

      : "⚪ このポケふたはまだ未訪問です。";

  document.getElementById(

    "modalApple"

  ).href =

    `http://maps.apple.com/?daddr=${spot.lat},${spot.lng}&dirflg=d`;

  document.getElementById(

    "modalGoogle"

  ).href =

    `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;

  document.getElementById(

    "detailModal"

  ).classList.add("show");

}

/* =====================================================

   モーダル閉じる

===================================================== */

function closeModal(event) {

  if (

    event &&

    event.target !==

      document.getElementById(

        "detailModal"

      )

  ) {

    return;

  }

  document.getElementById(

    "detailModal"

  ).classList.remove("show");

}

/* =====================================================

   リセット

===================================================== */

function resetStamps() {

  const ok =

    confirm(

      "本当に全部のスタンプをリセットしますか？"

    );

  if (!ok) {

    return;

  }

  localStorage.removeItem(

    "pokemonStamps"

  );

  stamps = {};

  updateCounts();

  renderSpots();

  renderMapMarkers();

  alert(

    "🔄 スタンプを全部リセットしました！"

  );
